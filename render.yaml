services:
  - type: web
    name: v100-analyst-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MARKET_SYMBOL
        value: 1HZ100V
      - key: CANDLE_GRANULARITY
        value: "60"
      - key: FORECAST_HORIZON_MINUTES
        value: "15"
      - key: MIN_MOVE_PCT
        value: "0.01"
      - key: LOG_LEVEL
        value: INFO
      - key: RENDER_EXTERNAL_URL
        sync: false